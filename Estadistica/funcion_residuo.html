<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Función f(a) = residuo de a ÷ 3</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
        h2 { color: #333; }
        canvas { border: 1px solid #ccc; margin-top: 20px; }
        table { margin: 20px auto; border-collapse: collapse; }
        th, td { border: 1px solid #999; padding: 8px 16px; text-align: center; }
        th { background: #eee; }
    </style>
</head>
<body>
    <h2>Función f(a) = residuo de a ÷ 3</h2>
    <p>Dominio S = {1, 2, 3, 4, 5, 6} &nbsp;|&nbsp; Codominio T = {0, 1, 2}</p>

    <canvas id="grafico" width="500" height="350"></canvas>

    <script>
        const canvas = document.getElementById('grafico');
        const ctx = canvas.getContext('2d');

        const datos = [[1,1],[2,2],[3,0],[4,1],[5,2],[6,0]];
        const origX = 60, origY = 280;
        const escX = 70, escY = 80;

        // Ejes
        ctx.beginPath(); ctx.moveTo(40, origY); ctx.lineTo(480, origY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(origX, 20); ctx.lineTo(origX, 310); ctx.stroke();

        // Etiquetas ejes
        ctx.font = '14px Arial';
        for (let i = 1; i <= 6; i++) {
            ctx.fillText(i, origX + i * escX - 4, origY + 20);
        }
        for (let j = 0; j <= 2; j++) {
            ctx.fillText(j, origX - 20, origY - j * escY + 5);
        }
        ctx.fillText('a →', 460, origY + 20);
        ctx.fillText('f(a)', origX - 10, 15);

        // Líneas punteadas + puntos
        datos.forEach(([x, y]) => {
            const px = origX + x * escX;
            const py = origY - y * escY;

            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#aaa';
            ctx.beginPath(); ctx.moveTo(px, origY); ctx.lineTo(px, py); ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#e74c3c';
            ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#333';
            ctx.fillText(`(${x},${y})`, px - 10, py - 12);
        });
    </script>
</body>
</html>
